<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    
    <link rel="stylesheet" href="./Styling/style.css">
    

  </head>
  <body>
    <!-- CRT Screen Effect -->
    <div
      class="fixed inset-0 pointer-events-none"
      style="
        background: radial-gradient(
          circle,
          transparent 70%,
          rgba(41, 97, 131, 0.5)100%
        );
        z-index: 100;
      "
    ></div>

    <!-- Header -->

    <header class="container mx-auto px-4 py-8">
      <div
        class="flex flex-col md:flex-row items-center justify-between retro-border p-6 bg-opacity-90 bg-gray-900"
      >
        <div class="text-center md:text-left mb-6 md:mb-0">
          <h1
            class="retro-title text-4xl md:text-6xl mb-2 glitch"
            data-text="Arts"
          >
            Arts
          </h1>
        </div>

        <div class="flex space-x-4">
          <!-- Home -->
          <a href="index.html" class="retro-btn px-4 py-2 flex items-center gap-2">
            <i class="fas fa-home"></i>
            
          </a>

          <!-- Contact -->
          <a href="" class="retro-btn px-4 py-2 flex items-center gap-2">
            <i class="fas fa-book"></i>
            
          </a>

          <!-- About -->
          
        </div>


        <!-- Add this button inside the header or wherever you want -->
        <!-- <button onclick="toggleTheme()" class="retro-btn px-4 py-2 flex items-center gap-2">
          
          Change Theme
        </button> -->
      </div>
    </header>

    <!-- Main Content -->
    
    <!-- Main Content: Museum Gallery -->
    <main class="container mx-auto px-4 py-8 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6" id="books-gallery">
      <!-- Books will be injected here by JS -->
    </main>

      

    <!-- Footer -->
    <footer class="container mx-auto px-4 py-8" >
      <img alt=""
          src="https://developer.nytimes.com/files/poweredby_nytimes_150a.png?v=1583354208339"
      />
      For educational purposes only.
    </footer>

    <script type="module" src="./functional/fetch_books.js"></script>

  </body>

</html>
